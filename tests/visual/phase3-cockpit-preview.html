<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMINA Phase 3 Visual Check</title><style>
:root{--bg:#f5f7f5;--surface:#fff;--soft:#edf8f3;--text:#1e2021;--muted:#69737b;--line:#dde4df;--brand:#40a77e;--red:#aa4242;--redsoft:#fff0f0;--shadow:0 18px 48px rgba(24,39,32,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fbfcfb,var(--bg));color:var(--text)}header{background:#fff;border-bottom:1px solid var(--line)}.shell{max-width:1440px;margin:auto;padding:0 24px}.head{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.mark{width:36px;height:36px;border-radius:11px;background:var(--brand)}nav{display:flex;gap:18px;color:var(--muted);font-weight:750}.context{padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:.76rem}.context strong,.context span{display:block}.context span{color:var(--muted);margin-top:2px}main{padding:30px 0}.hero{display:flex;justify-content:space-between;gap:16px}.hero h1{margin:0;font-size:clamp(2rem,4vw,3.4rem);letter-spacing:-.05em}.hero p{color:var(--muted)}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.project{display:flex;justify-content:space-between;gap:12px;margin:18px 0;padding:16px}.cockpit{padding:18px}.eyebrow{color:#287f61;font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.cockpit h2{margin:5px 0}.sub{color:var(--muted)}.alert{margin-top:18px;padding:16px;border:1px solid #ecd0d0;border-radius:14px;background:var(--redsoft)}.alert.ok{border-color:#cfe7d8;background:var(--soft)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.kpi{padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff}.kpi span,.kpi small{display:block;color:var(--muted)}.kpi strong{display:block;margin:8px 0;font-size:1.65rem}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.panel{padding:16px;border:1px solid var(--line);border-radius:14px}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.pill{color:#287f61;background:var(--soft);border-radius:99px;padding:4px 8px;font-size:.74rem;font-weight:800}.neutral{min-height:100vh;display:grid;place-items:center;padding:24px}.neutral .card{max-width:520px;padding:30px}.neutral h1{font-size:3rem;margin:20px 0 10px}.btn{display:inline-block;margin-top:18px;padding:11px 15px;border-radius:11px;background:#edf1ef;font-weight:800}.visual-note{position:fixed;right:10px;bottom:10px;padding:6px 9px;background:#202223;color:#fff;border-radius:8px;font-size:.68rem}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:650px){.shell{padding:0 14px}.head{align-items:flex-start;flex-direction:column;padding:12px 0}nav{flex-wrap:wrap;gap:10px}.hero{display:block}.project{display:block}.kpis{grid-template-columns:1fr}.cockpit{padding:14px}.neutral h1{font-size:2.2rem}}
</style><style>.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.grid{grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr)}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}@media(max-width:650px){.kpis{grid-template-columns:1fr}}</style></head><body><div id="app"></div><div class="visual-note">Lokale visuelle Phase-3-Prüffixture · keine Produktdaten</div><script>
const params=new URLSearchParams(location.search),profile=params.get("profile")||"cfo",role=params.get("role")||({cfo:"CFO / Geschäftsführung",project:"Projektleitung Abschluss",accounting_lead:"Leiter Rechnungswesen",worker:"Bilanzbuchhaltung"}[profile]);
const scenarios={cfo:{eyebrow:"Management-Cockpit",title:"Abschluss 2026",sub:"Gesamtstatus, Entscheidungsbedarf und Terminrisiken",alert:"2 kritische Vorgänge benötigen Aufmerksamkeit.",kpis:[["Ist-Fortschritt","68 %","34 von 50 abgeschlossen"],["Planabweichung","−4 %","Planfortschritt 72 %"],["Kritische Engpässe","2","überfällig oder blockiert"],["Tage bis Abschluss","41","bis zum Abschlussstichtag"]],left:"Entscheidungsbedarf",right:"KIRA-Einschätzung"},project:{eyebrow:"Projektsteuerung",title:"Abschluss 2026",sub:"Gesamtkoordination und sichere Projektadministration",alert:"3 Vorgänge benötigen Koordination.",kpis:[["Offen","16","aktive Aufgaben"],["Überfällig","3","terminlich im Verzug"],["Nicht zugeordnet","2","Verantwortung fehlt"],["Reviews","4","1 Einladung · 1 Vertretung"]],left:"Koordinationsbedarf",right:"Projektzugänge"},accounting_lead:{eyebrow:"Teamsteuerung",title:"Abschluss 2026",sub:"Fachliche Qualität, Reviews und Auslastung",alert:"2 Teamaufgaben benötigen Steuerung.",kpis:[["Kritisch überfällig","2","blockiert oder im Verzug"],["Offene Reviews","4","warten auf Prüfung"],["Nicht zugeordnet","2","Verantwortung fehlt"],["Teamfortschritt","68 %","RLS-sichtbarer Bestand"]],left:"Teamaufgaben mit Handlungsbedarf",right:"Team-Auslastung"},worker:{eyebrow:"Mein Tag",title:`Mein Tag – ${role}`,sub:"Eigene Aufgaben, Rückfragen und nächste Aktion",alert:"Eine priorisierte Aufgabe wartet heute.",kpis:[["Überfällig","1","eigene offene Aufgabe"],["Heute fällig","2","noch zu bearbeiten"],["Rückfragen / Nacharbeit","1","benötigt Reaktion"],["Erledigt","8","im aktuellen Projekt"]],left:"Meine Aufgaben",right:"Stellvertretung"}};
if(profile==="neutral"){document.getElementById("app").innerHTML='<section class="neutral"><div class="card"><div class="brand"><div class="mark"></div>LUMINA</div><h1>Projektzugriff</h1><p class="sub">Für diesen Zugang ist keine eindeutig akzeptierte Projektrolle verfügbar. Bitte wenden Sie sich an die Projektverantwortlichen.</p><span class="btn">Abmelden</span></div></section>'}else{const s=scenarios[profile]||scenarios.worker;document.getElementById("app").innerHTML=`<header><div class="shell head"><div class="brand"><div class="mark"></div>LUMINA</div><nav>Cockpit　Aufgaben　Datenräume　Kommunikation</nav><div class="context"><strong>Abschluss 2026</strong><span>${role}</span></div></div></header><main><div class="shell"><div class="hero"><div><h1>Abschluss-Cockpit</h1><p>Transparenz über Aufgaben, Datenlieferungen und Prüfungsbedarf.</p></div></div><div class="card project"><strong>Abschluss 2026</strong><span class="sub">Muster GmbH · 31.12.2026</span></div><section class="card cockpit"><div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2><div class="sub">${s.sub} · ${role}</div><div class="alert ${profile==="worker"?"ok":""}"><strong>${s.alert}</strong></div><div class="kpis">${s.kpis.map(k=>`<div class="kpi"><span>${k[0]}</span><strong>${k[1]}</strong><small>${k[2]}</small></div>`).join("")}</div><div class="grid"><div class="panel"><h3>${s.left}</h3><div class="row"><span>Abstimmung Rückstellungen</span><span class="pill">heute</span></div><div class="row"><span>Prüfnachweis vervollständigen</span><span class="pill">offen</span></div></div><div class="panel"><h3>${s.right}</h3><div class="row"><span>${profile==="worker"?"Vertretung für Hauptperson":"Aktueller Status"}</span><span class="pill">sicher</span></div><p class="sub">Nur freigegebene, RLS-sichtbare Informationen.</p></div></div></section></div></main>`}
</script></body></html>
